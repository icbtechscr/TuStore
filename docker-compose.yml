services:
  tustore:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_ORIGIN: ${NEXT_PUBLIC_SITE_ORIGIN}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_TUSTORE_LEGACY_MEDIA_HOSTS: ${NEXT_PUBLIC_TUSTORE_LEGACY_MEDIA_HOSTS}
        NEXT_PUBLIC_TUSTORE_PREVIOUS_STORAGE_ORIGINS: ${NEXT_PUBLIC_TUSTORE_PREVIOUS_STORAGE_ORIGINS}
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "scripts/self-host/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
